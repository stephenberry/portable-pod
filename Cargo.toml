[workspace]
resolver = "2"
members = ["crates/portable-pod", "crates/portable-pod-derive", "crates/cross-crate-fixture"]

[workspace.package]
edition = "2024"
# The runtime's version. The derive has its own; see `portable-pod-derive` below.
version = "0.1.4"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stephenberry/portable-pod"
rust-version = "1.96"
authors = ["Stephen Berry"]

[workspace.dependencies]
portable-pod = { path = "crates/portable-pod", version = "0.1.4" }
# Exact, and it stays exact. The derive's expansion names items of the runtime it ships with
# (`Pod::SHAPE`, `Pod::__SHAPE_FOLD`), so a runtime must never be paired with a derive other than
# its own. The derive is versioned separately so that a derive needing a newer runtime can take a
# version the older runtimes' requirements do not admit: runtime 0.1.4 asks for `^0.1.4`, so the
# derive that emits `SHAPE` is 0.2.0. A release bumps this line and the derive's `version` together.
# README "Versions" and DESIGN.md §12.
portable-pod-derive = { path = "crates/portable-pod-derive", version = "=0.1.4" }
