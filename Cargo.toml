[workspace]
resolver = "2"
members = ["crates/portable-pod", "crates/portable-pod-derive"]

[workspace.package]
edition = "2024"
version = "0.1.4"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stephenberry/portable-pod"
rust-version = "1.96"
authors = ["Stephen Berry"]

[workspace.dependencies]
portable-pod = { path = "crates/portable-pod", version = "0.1.4" }
# Exact: the derive's expansion names items of this version of the runtime (`Pod::SHAPE`,
# `Pod::__SHAPE_FOLD`), so the two must not be paired across versions. See DESIGN.md §12.
portable-pod-derive = { path = "crates/portable-pod-derive", version = "=0.1.4" }
